<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "NRMA" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #005f73;
        --primary-light: #0a9396;
        --accent: #94d2bd;
        --bg: #f5f7fb;
        --text: #102a43;
        --muted: #627d98;
        --card-bg: #ffffff;
        --border: #d9e2ec;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--primary);
        color: #fff;
        padding: 1rem 2rem;
        box-shadow: 0 2px 8px rgba(16, 42, 67, 0.2);
      }
      header .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        margin-left: 1rem;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        padding-bottom: 0.25rem;
      }
      nav a.active,
      nav a:hover {
        border-color: var(--accent);
      }
      main {
        flex: 1;
        padding: 2rem 1rem 3rem;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
      }
      .card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 10px 30px rgba(16, 42, 67, 0.08);
        border: 1px solid var(--border);
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.2rem;
        color: var(--primary);
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input[type="number"],
      input[type="text"],
      select,
      input[type="file"],
      textarea {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 1rem;
        font-family: inherit;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 999px;
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(0, 95, 115, 0.25);
      }
      button:hover {
        background: var(--primary-light);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .stat {
        background: rgba(148, 210, 189, 0.2);
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
      }
      .stat h3 {
        margin: 0;
        font-size: 1rem;
        color: var(--muted);
      }
      .stat p {
        margin: 0.3rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--primary);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      table th,
      table td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.75rem;
        text-align: left;
        font-size: 0.9rem;
      }
      table th {
        background: rgba(0, 95, 115, 0.08);
        color: var(--primary);
        font-weight: 600;
      }
      .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .chart-grid img {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
      }
      .alert {
        border-radius: 12px;
        padding: 0.85rem 1rem;
        background: rgba(255, 99, 71, 0.15);
        color: #9a0414;
        border: 1px solid rgba(255, 99, 71, 0.4);
        margin-bottom: 1rem;
      }
      .table-scroll {
        max-height: 360px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.25rem;
        background: #fff;
        margin-top: 1rem;
      }
      footer {
        text-align: center;
        padding: 1rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        text-decoration: underline;
      }
      @media (max-width: 640px) {
        header .nav {
          flex-direction: column;
          gap: 0.75rem;
        }
        nav a {
          margin: 0 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav container">
        <h1>NRMA</h1>
        <nav>
          <a href="{{ url_for('upload_file') }}" class="{% if active_page == 'upload' %}active{% endif %}">Assignments</a>
          <a href="{{ url_for('simulations') }}" class="{% if active_page == 'simulations' %}active{% endif %}">Stress Tests</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer>
      Built by <a href="https://roshanlodha.github.io" target="_blank" rel="noopener">Roshan Lodha</a>.
    </footer>
  </body>
</html>
